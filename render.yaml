services:
  - type: web
    name: fashionfit-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: WIDGET_ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FASHN_API_KEY
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_CLOUD_LOCATION
        sync: false
      - key: GOOGLE_VTO_MODEL
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: TRYON_DEFAULT_PROVIDER
        sync: false
      - key: TRYON_FALLBACK_PROVIDER
        sync: false
      - key: TRYON_ALLOW_MOCK_IN_PRODUCTION
        sync: false
      - key: SECURITY_AUDIT_LOG_ENABLED
        sync: false
      - key: API_KEY_ABUSE_WINDOW_MS
        sync: false
      - key: API_KEY_ABUSE_MAX_FAILURES
        sync: false
      - key: API_KEY_ABUSE_BLOCK_MS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_GROWTH
        sync: false
      - key: STRIPE_PRICE_SCALE
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: DEMO_API_KEY
        sync: false
      - key: DEMO_SHOP_ID
        sync: false
      - key: DEMO_DAILY_LIMIT
        sync: false
      - key: DEMO_PRODUCTS_SOURCE_URL
        sync: false

  - type: web
    name: fashionfit-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: build
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false
      - key: REACT_APP_ADMIN_EMAILS
        sync: false
